name: Release

# Build and publish the container image and the Windows installer.
#
#   push to main    -> :edge image + rolling "edge" pre-release
#   push tag vX.Y.Z -> :X.Y.Z + :latest image + a GitHub release
#   manual run      -> builds both, publishes nothing
#
# Both the edge pre-release and the tagged release carry the Windows installer.
# Auth is the built-in GITHUB_TOKEN — no secrets to configure.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes to main don't need an image/installer build. A release
    # tag sits on a real code commit, so this won't skip a release; force one
    # any time with the manual "Run workflow" button.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so `git describe` works

      - name: Work out version, channel and tags
        id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"; channel="release"
            tags="${image}:${version},${image}:latest"
          else
            version="$(git describe --tags --always --dirty)"; channel="edge"
            tags="${image}:edge"
          fi
          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }} # dispatch builds but doesn't publish
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CINEFIN_VERSION=${{ steps.meta.outputs.version }}
            CINEFIN_COMMIT=${{ github.sha }}
            CINEFIN_CHANNEL=${{ steps.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Assemble the Windows installer from the wheel: a relocatable Python with the
  # wheel pip-installed, ffmpeg and the tray, wrapped by Inno Setup. No SPA /
  # backend build here and no freezing — just download + pip + iscc.
  windows:
    runs-on: windows-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist-wheel
      - run: choco install innosetup --no-progress -y
      - name: Work out version
        id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo edge)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer
        shell: pwsh
        run: |
          $whl = (Get-ChildItem dist-wheel\*.whl | Select-Object -First 1).FullName
          packaging/windows/build.ps1 -Version "${{ steps.v.outputs.version }}" -Wheel $whl
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/Output/*.exe

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - name: Build the pip/pipx wheel
        run: packaging/pip/build-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: backend/dist/*.whl

  edge:
    runs-on: ubuntu-latest
    needs: [image, windows, wheel]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-win
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist-wheel
      - name: Refresh the rolling "edge" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create edge \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Latest dev build (edge)" \
            --notes "Rolling build of the latest \`main\` (\`${GITHUB_SHA::8}\`) — unstable. Docker image: \`${REGISTRY}/${IMAGE_NAME,,}:edge\`." \
            dist-win/*.exe dist-wheel/*.whl

  release:
    runs-on: ubuntu-latest
    needs: [image, windows, wheel]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-win
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist-wheel
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist-win/*.exe dist-wheel/*.whl
