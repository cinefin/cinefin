name: Release

# Build and publish the container image, the pip/pipx wheel, and (edge only) the
# Windows installer.
#
#   push to main    -> :edge image + rolling "edge" PRE-RELEASE (wheel + Windows)
#   push tag vX.Y.Z -> :X.Y.Z + :latest image + a STABLE release (wheel only)
#   manual run      -> builds, publishes nothing
#
# Windows is EDGE-ONLY on purpose: the installer ships on the rolling edge
# pre-release for testing, never attached to a tagged stable release yet.
# The version is the git tag — no file is hand-edited: the image takes it as a
# build-arg, and the wheel job stamps pyproject from the tag before `poetry build`.
# Auth is the built-in GITHUB_TOKEN — no secrets to configure.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Non-code pushes to main (docs, readme, CI/workflow config, shell tooling)
    # don't need a build. A release tag sits on a real code commit, so this won't
    # skip a release; force one any time with the manual "Run workflow" button.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".dockerignore"
      - ".github/**"
      - ".gitea/**"
      - "scripts/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so `git describe` works

      - name: Work out version, channel and tags
        id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"; channel="release"
            tags="${image}:${version},${image}:latest"
          else
            version="$(git describe --tags --always --dirty)"; channel="edge"
            tags="${image}:edge"
          fi
          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }} # dispatch builds but doesn't publish
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CINEFIN_VERSION=${{ steps.meta.outputs.version }}
            CINEFIN_COMMIT=${{ github.sha }}
            CINEFIN_CHANNEL=${{ steps.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Assemble the Windows installer from the wheel: a relocatable Python with the
  # wheel pip-installed, ffmpeg and the tray, wrapped by Inno Setup. No SPA /
  # backend build here and no freezing — just download + pip + iscc.
  windows:
    # EDGE ONLY: build the installer on main / manual runs, never on a tag.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist-wheel
      - run: choco install innosetup --no-progress -y
      - name: Work out version
        id: v
        shell: bash
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo edge)" >> "$GITHUB_OUTPUT"
      - name: Build installer
        shell: pwsh
        run: |
          $whl = (Get-ChildItem dist-wheel\*.whl | Select-Object -First 1).FullName
          packaging/windows/build.ps1 -Version "${{ steps.v.outputs.version }}" -Wheel $whl
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/Output/*.exe

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - name: Stamp the wheel version from the tag
        # The git tag is the source of truth. On a tag build, set pyproject's
        # version to the tag so the wheel filename/metadata match — ephemeral,
        # never committed. Edge builds keep the baseline version in pyproject.
        if: github.ref_type == 'tag'
        run: cd backend && poetry version "${GITHUB_REF_NAME#v}"
      - name: Build the pip/pipx wheel
        run: packaging/pip/build-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: backend/dist/*.whl

  edge:
    runs-on: ubuntu-latest
    needs: [image, windows, wheel]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the pending-changes list
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-win
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist-wheel
      - name: Build the edge notes (the one-liner + changes pending since the last release)
        run: |
          set -euo pipefail
          base="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          {
            echo "Rolling build of the latest \`main\` (\`${GITHUB_SHA::8}\`) — unstable. Docker image: \`${REGISTRY}/${IMAGE_NAME,,}:edge\`."
            echo
            echo "## Pending changes${base:+ since ${base}}"
            echo
            scripts/changelog.sh HEAD 20
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"
      - name: Refresh the rolling "edge" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create edge \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Latest dev build (edge)" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist-win/*.exe dist-wheel/*.whl

  release:
    runs-on: ubuntu-latest
    needs: [image, wheel] # no Windows on a stable release
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist-wheel
      - name: Build the changelog for this release
        # Shared, identical to cinefin-playout's — the single source of truth for
        # the notes so the forges can't drift.
        run: |
          set -euo pipefail
          {
            echo "## Changes"
            echo
            scripts/changelog.sh "${GITHUB_REF_NAME}"
            echo
            echo "Docker image: \`${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_REF_NAME#v}\`"
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"
      - name: Create the GitHub release (stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist-wheel/*.whl
