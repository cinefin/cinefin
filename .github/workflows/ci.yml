# Lint + test on every pull request and push to main.
#
# The job installs the toolchains, then hands off to the Makefile: `make setup`
# (poetry + npm deps) and `make check` (SPA build + ruff lint/format + pytest).
# CI runs the SAME `make` targets you run locally, so the two can't drift — the
# language-specific detail lives in the Makefile, not this file.
name: CI

on:
  # Skip non-code changes (docs, readme, CI/workflow config, shell tooling) — they
  # can't affect the build or tests. Kept in step with release.yml's paths-ignore.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".dockerignore"
      - ".github/**"
      - ".gitea/**"
      - "scripts/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".dockerignore"
      - ".github/**"
      - ".gitea/**"
      - "scripts/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system libraries
        # runtime libs for pymediainfo / python-escpos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmediainfo0v5 libusb-1.0-0

      - name: Install poetry
        # >=2.2 required: earlier releases ignore the PEP 735 [dependency-groups]
        # block and lock WITHOUT pytest (pyproject's requires-poetry enforces this).
        run: pip install --quiet "poetry>=2.2"

      - name: Install dependencies
        run: make setup

      - name: Lint + build + test
        run: make check
