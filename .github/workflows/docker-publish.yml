# Build the Cinefin container and publish it to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>), and cut a GitHub Release on version tags.
#
# Versioning: git tags `vMAJOR.MINOR.PATCH` (SemVer) are the source of truth.
#   - push tag vX.Y.Z  -> :X.Y.Z  :X.Y  :X  :latest   (a release)
#   - push to main      -> :edge   :main-<short-sha>   (bleeding edge)
#   - manual run         -> :edge
# `:latest` only ever moves on a released tag, never a raw main build.
#
# On a tag the `release` job generates a changelog of the commits since the
# previous tag, publishes it as the GitHub Release body, and prepends it to
# CHANGELOG.txt on main (committed with [skip ci]).
#
# Auth: the built-in GITHUB_TOKEN (packages: write) pushes to GHCR and creates
# the release — no PAT or secrets to configure.
name: Build & publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so `git describe` works

      - name: Compute version and short SHA
        id: vars
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo edge)" >> "$GITHUB_OUTPUT"
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags fire only on a vX.Y.Z tag; edge/main-<sha> only on main.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
          # `latest` only on a released tag, never a main build.
          flavor: latest=auto

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # amd64 only for now. The image is arm64-ready (static ffmpeg + arm64
          # wheels), so add `linux/arm64` here to publish multi-arch once tested.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CINEFIN_VERSION=${{ steps.vars.outputs.version }}
            CINEFIN_COMMIT=${{ steps.vars.outputs.short_sha }}
            CINEFIN_CHANNEL=${{ steps.vars.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A single rolling "edge" pre-release that always tracks the latest main —
  # the dev counterpart to the versioned releases below. Points at the :edge
  # image built above; never marked "Latest" so it can't shadow a real release.
  dev-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags for the notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update the rolling "edge" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          LAST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -1)"
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"
          NOTES="$(git log --no-merges --invert-grep --grep='^Update CHANGELOG for ' \
                     --pretty='format:- %s (%h)' "${RANGE}" | head -50)"
          [ -n "${NOTES}" ] || NOTES="- (no changes since ${LAST_TAG:-the start})"
          {
            echo "Rolling build of the latest \`main\` (\`${GITHUB_SHA::8}\`) — unstable."
            echo
            echo "Docker image: \`${IMAGE}:edge\`"
            echo
            echo "## Changes since ${LAST_TAG:-the beginning}"
            echo
            echo "${NOTES}"
          } > /tmp/edge.md
          # Move the single `edge` tag+release to this commit.
          gh release delete edge --cleanup-tag --yes 2>/dev/null || true
          gh release create edge \
            --prerelease \
            --latest=false \
            --target "${GITHUB_SHA}" \
            --title "Latest dev build (edge)" \
            --notes-file /tmp/edge.md
          echo "Updated the edge pre-release to ${GITHUB_SHA::8}."

  release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_type == 'tag'
    permissions:
      contents: write # create the release + push the CHANGELOG commit
    steps:
      - name: Checkout (full history + tags for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the changelog for this release
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"           # e.g. v1.2.3
          DATE="$(date -u +%Y-%m-%d)"
          # The numerically-previous vX.Y.Z tag (empty for the first release).
          PREV="$(git tag --list 'v*' --sort=-version:refname \
                    | awk -v cur="${REF}" 'found { print; exit } $0 == cur { found = 1 }')"
          if [ -n "${PREV}" ]; then RANGE="${PREV}..${REF}"; else RANGE="${REF}"; fi
          echo "Changelog range: ${PREV:-<start>}..${REF}"
          # One bullet per non-merge commit; drop the bot's own changelog commits.
          NOTES="$(git log --no-merges --invert-grep --grep='^Update CHANGELOG for ' \
                     --pretty='format:- %s (%h)' "${RANGE}")"
          [ -n "${NOTES}" ] || NOTES="- No code changes."
          printf '%s\n' "${NOTES}" > /tmp/notes.txt
          # The CHANGELOG.txt section (indented bullets under a version heading).
          printf '%s - %s\n' "${REF}" "${DATE}" > /tmp/section.txt
          sed 's/^/  /' /tmp/notes.txt >> /tmp/section.txt
          printf '\n' >> /tmp/section.txt
          echo "----- release notes -----"; cat /tmp/notes.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          {
            echo "## Changes"
            echo
            cat /tmp/notes.txt
            echo
            echo "Docker image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
          } > /tmp/body.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/body.txt

      - name: Prepend the changelog to CHANGELOG.txt on main
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          BRANCH="main"

          # Land the changelog on the default branch, not the detached tag commit.
          git fetch --quiet origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"

          if [ -f CHANGELOG.txt ] && head -1 CHANGELOG.txt | grep -q '^Cinefin changelog$'; then
            # Keep the file header on top; insert the new section right below it.
            { head -2 CHANGELOG.txt; cat /tmp/section.txt; tail -n +3 CHANGELOG.txt; } > /tmp/CHANGELOG.txt
          elif [ -f CHANGELOG.txt ]; then
            cat /tmp/section.txt CHANGELOG.txt > /tmp/CHANGELOG.txt
          else
            { echo "Cinefin changelog"; echo; cat /tmp/section.txt; } > /tmp/CHANGELOG.txt
          fi
          mv /tmp/CHANGELOG.txt CHANGELOG.txt

          # Stage first: `git diff --quiet` ignores untracked files, so a brand
          # new CHANGELOG.txt would otherwise be skipped as "no change".
          git add CHANGELOG.txt
          if git diff --cached --quiet -- CHANGELOG.txt; then
            echo "CHANGELOG.txt already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CHANGELOG for ${REF} [skip ci]"
          # A push with GITHUB_TOKEN never re-triggers workflows, so this is safe.
          git push origin "HEAD:${BRANCH}"
          echo "Committed CHANGELOG.txt for ${REF} to ${BRANCH}."
